<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnPro - Premium Earning Platform</title>

  <!-- Google Fonts & Firebase Compatibility SDKs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-main: #070a12;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --accent-gold: #f59e0b;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --input-bg: rgba(10, 15, 26, 0.6);
      --input-border: rgba(255, 255, 255, 0.12);
      --input-focus: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animated Dynamic Background Elements */
    .bg-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
    }

    .bg-glow-1 {
      width: 320px;
      height: 320px;
      background: rgba(16, 185, 129, 0.18);
      top: -50px;
      left: -50px;
    }

    .bg-glow-2 {
      width: 350px;
      height: 350px;
      background: rgba(99, 102, 241, 0.15);
      bottom: -80px;
      right: -80px;
    }

    /* Notification Toasts */
    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 90vw;
      width: 360px;
    }

    .toast {
      background: rgba(22, 30, 49, 0.95);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.3s ease forwards;
      font-size: 0.9rem;
    }

    .toast.success { border-left: 4px solid var(--primary); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.warning { border-left: 4px solid var(--warning); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Main Container */
    .main-wrapper {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    /* Header & Branding */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 18px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .brand-logo svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    .brand-title {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Card Container */
    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    /* Tabs */
    .tab-switcher {
      display: flex;
      background: rgba(10, 15, 26, 0.7);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    /* Forms */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      stroke: var(--text-muted);
      fill: none;
      pointer-events: none;
      transition: var(--transition);
    }

    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .form-select {
      appearance: none;
      cursor: pointer;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .form-input:focus + .input-icon,
    .form-input:not(:placeholder-shown) + .input-icon {
      stroke: var(--primary);
    }

    /* Password Toggle Icon */
    .password-toggle {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      stroke: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
    }

    /* Checkbox & Links */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.825rem;
      margin-bottom: 20px;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      user-select: none;
    }

    .checkbox-container input {
      display: none;
    }

    .custom-checkbox {
      width: 18px;
      height: 18px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background: var(--input-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .checkbox-container input:checked + .custom-checkbox {
      background: var(--primary);
      border-color: var(--primary);
    }

    .custom-checkbox svg {
      width: 12px;
      height: 12px;
      stroke: white;
      display: none;
    }

    .checkbox-container input:checked + .custom-checkbox svg {
      display: block;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Primary Submit Button */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
      transition: var(--transition);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Spinner Loading State */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Custom Form Display Logic */
    .form-section {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .form-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modal for Reset Password */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Footer */
    .app-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .app-footer a {
      color: var(--text-muted);
      text-decoration: underline;
    }

    /* Custom Select Arrow */
    .select-arrow {
      position: absolute;
      right: 14px;
      pointer-events: none;
      stroke: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <div class="main-wrapper">
    
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="brand-title">EarnPro</h1>
      <p class="brand-subtitle">Smart Mobile Earning Network</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      
      <!-- Tab Switcher -->
      <div class="tab-switcher">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="form-login" class="form-section active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="login-remember">
            <span class="custom-checkbox">
              <svg viewBox="0 0 24 24" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            Remember me
          </label>
          <a href="#" class="forgot-link" onclick="openResetModal(event)">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-submit" id="btn-login-submit">
          <span class="spinner" id="spinner-login"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="form-register" class="form-section" onsubmit="handleRegister(event)">
        
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-wrapper">
            <input type="text" id="reg-fullname" class="form-input" placeholder="John Doe" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Gender</label>
          <div class="input-wrapper">
            <select id="reg-gender" class="form-select" required>
              <option value="" disabled selected>Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/></svg>
            <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">WhatsApp Number</label>
          <div class="input-wrapper">
            <input type="tel" id="reg-whatsapp" class="form-input" placeholder="+1234567890" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 characters" minlength="6" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('reg-password', this)">
              <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat password" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Referral Code (Optional)</label>
          <div class="input-wrapper">
            <input type="text" id="reg-referral" class="form-input" placeholder="6-digit numeric UID" maxlength="6" pattern="[0-9]*">
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-container">
            <input type="checkbox" id="reg-terms" required>
            <span class="custom-checkbox">
              <svg viewBox="0 0 24 24" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>
            </span>
            I accept the <a href="#" style="color:var(--primary); margin-left:3px;"> Terms & Conditions</a>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="btn-reg-submit">
          <span class="spinner" id="spinner-reg"></span>
          <span class="btn-text">Create Account</span>
        </button>
      </form>

    </div>

    <div class="app-footer">
      &copy; 2025 EarnPro Platform. All rights reserved.
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div class="modal-backdrop" id="reset-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Reset Password</h3>
        <button class="modal-close" onclick="closeResetModal()">&times;</button>
      </div>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">
        Enter your account email to receive a password recovery link.
      </p>
      <form onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <div class="input-wrapper">
            <input type="email" id="reset-email" class="form-input" placeholder="name@example.com" required>
            <svg class="input-icon" viewBox="0 0 24 24" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btn-reset-submit">
          <span class="spinner" id="spinner-reset"></span>
          <span class="btn-text">Send Reset Link</span>
        </button>
      </form>
    </div>
  </div>

  <!-- Application Logic Scripts -->
  <script>
    // -------------------------------------------------------------
    // 1. Firebase Initialization Configuration
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBFKWIm1kUaP47rsHtEEP05G66-SSRsvwA",
      authDomain: "gamil-sever.firebaseapp.com",
      databaseURL: "https://gamil-sever-default-rtdb.firebaseio.com",
      projectId: "gamil-sever",
      storageBucket: "gamil-sever.firebasestorage.app",
      messagingSenderId: "895391304528",
      appId: "1:895391304528:web:4b86c59ce3163607beba55"
    };

    // Initialize Firebase Services
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // -------------------------------------------------------------
    // 2. UI / Tab Management & Helper Functions
    // -------------------------------------------------------------
    function switchTab(tabName) {
      const loginBtn = document.getElementById('tab-login');
      const regBtn = document.getElementById('tab-register');
      const loginForm = document.getElementById('form-login');
      const regForm = document.getElementById('form-register');

      if (tabName === 'login') {
        loginBtn.classList.add('active');
        regBtn.classList.remove('active');
        loginForm.classList.add('active');
        regForm.classList.remove('active');
      } else {
        regBtn.classList.add('active');
        loginBtn.classList.remove('active');
        regForm.classList.add('active');
        loginForm.classList.remove('active');
      }
    }

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.style.stroke = 'var(--primary)';
      } else {
        input.type = 'password';
        btn.style.stroke = 'var(--text-muted)';
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let iconSvg = '';
      if(type === 'success') {
        iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
      } else if (type === 'error') {
        iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`;
      } else {
        iconSvg = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`;
      }

      toast.innerHTML = `${iconSvg} <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse forwards';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function toggleLoading(btnId, spinnerId, isLoading) {
      const btn = document.getElementById(btnId);
      const spinner = document.getElementById(spinnerId);
      const textSpan = btn.querySelector('.btn-text');

      if (isLoading) {
        btn.disabled = true;
        spinner.style.display = 'inline-block';
        textSpan.style.opacity = '0.7';
      } else {
        btn.disabled = false;
        spinner.style.display = 'none';
        textSpan.style.opacity = '1';
      }
    }

    // Modal Controls
    function openResetModal(e) {
      e.preventDefault();
      document.getElementById('reset-modal').classList.add('active');
    }

    function closeResetModal() {
      document.getElementById('reset-modal').classList.remove('active');
    }

    // Generate Unique 6-Digit Numeric UID
    function generateNumericUID() {
      return Math.floor(100000 + Math.random() * 900000).toString();
    }

    // -------------------------------------------------------------
    // 3. Registration Flow
    // -------------------------------------------------------------
    async function handleRegister(event) {
      event.preventDefault();

      const name = document.getElementById('reg-fullname').value.trim();
      const gender = document.getElementById('reg-gender').value;
      const whatsapp = document.getElementById('reg-whatsapp').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;
      const referralInput = document.getElementById('reg-referral').value.trim();

      // Input Validations
      if (!name || !gender || !whatsapp || !email || !password || !confirmPassword) {
        showToast('Please fill in all required fields.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      if (referralInput && (!/^\d{6}$/.test(referralInput))) {
        showToast('Referral code must be a 6-digit number.', 'error');
        return;
      }

      toggleLoading('btn-reg-submit', 'spinner-reg', true);

      try {
        // Create user in Firebase Authentication
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const authUid = userCredential.user.uid;

        // Generate custom 6-digit numeric UID for Referral System
        const numericUid = generateNumericUID();

        // Database payload matching standard requirements
        const userData = {
          name: name,
          gender: gender,
          whatsapp: whatsapp,
          email: email,
          uid: numericUid,
          referralCode: numericUid,
          referredBy: referralInput || null,
          accountStatus: "pending",
          balance: 0,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };

        // Store user data in Firebase Realtime Database
        await database.ref('users/' + authUid).set(userData);

        // Sign out immediately so pending user is not authenticated
        await auth.signOut();

        showToast('Registration successful! Account pending activation.', 'success');
        document.getElementById('form-register').reset();
        switchTab('login');

      } catch (error) {
        let errorMsg = error.message;
        if (error.code === 'auth/email-already-in-use') {
          errorMsg = 'This email address is already registered.';
        } else if (error.code === 'auth/weak-password') {
          errorMsg = 'Password should be at least 6 characters.';
        }
        showToast(errorMsg, 'error');
      } finally {
        toggleLoading('btn-reg-submit', 'spinner-reg', false);
      }
    }

    // -------------------------------------------------------------
    // 4. Login Flow
    // -------------------------------------------------------------
    async function handleLogin(event) {
      event.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showToast('Please provide both email and password.', 'error');
        return;
      }

      toggleLoading('btn-login-submit', 'spinner-login', true);

      try {
        // Authenticate with Firebase Auth
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const authUid = userCredential.user.uid;

        // Fetch User record from Database
        const snapshot = await database.ref('users/' + authUid).once('value');
        const userData = snapshot.val();

        if (!userData) {
          await auth.signOut();
          showToast('User record not found.', 'error');
          toggleLoading('btn-login-submit', 'spinner-login', false);
          return;
        }

        // Account Status Check
        if (userData.accountStatus === 'pending') {
          await auth.signOut();
          showToast('Your account is pending approval. Please wait for activation.', 'warning');
        } else if (userData.accountStatus === 'active') {
          showToast('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 1200);
        } else {
          await auth.signOut();
          showToast('Your account is restricted or inactive.', 'error');
        }

      } catch (error) {
        let errorMsg = 'Invalid login credentials.';
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
          errorMsg = 'Incorrect email or password.';
        } else if (error.code === 'auth/invalid-email') {
          errorMsg = 'Please enter a valid email address.';
        }
        showToast(errorMsg, 'error');
      } finally {
        toggleLoading('btn-login-submit', 'spinner-login', false);
      }
    }

    // -------------------------------------------------------------
    // 5. Password Reset Handler
    // -------------------------------------------------------------
    async function handleForgotPassword(event) {
      event.preventDefault();
      const email = document.getElementById('reset-email').value.trim();

      if (!email) {
        showToast('Please enter your email address.', 'error');
        return;
      }

      toggleLoading('btn-reset-submit', 'spinner-reset', true);

      try {
        await auth.sendPasswordResetEmail(email);
        showToast('Password reset link sent! Check your inbox.', 'success');
        closeResetModal();
        document.getElementById('reset-email').value = '';
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        toggleLoading('btn-reset-submit', 'spinner-reset', false);
      }
    }
  </script>
</body>
