<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <style>
    /* ==========================================================================
       1. GLOBAL STYLES & MOBILE-FIRST SYSTEM
       ========================================================================== */
    :root {
      --bg-dark: #080c14;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-glow: rgba(16, 185, 129, 0.2);
      
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.25);
      --silver: #cbd5e1;
      --silver-glow: rgba(203, 213, 225, 0.2);
      --bronze: #d97706;
      --bronze-glow: rgba(217, 119, 6, 0.2);

      --danger: #ef4444;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

      /* Mobile Metrics */
      --page-pad: 14px;
      --card-gap: 12px;
      --section-gap: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: var(--page-pad);
      padding-bottom: calc(75px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
      font-size: 13px;
      line-height: 1.4;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.08);
      filter: blur(90px);
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: -1;
    }

    /* Toast Notification Container */
    #toast-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 90%;
      max-width: 380px;
      pointer-events: none;
    }

    .toast {
      background: rgba(22, 30, 49, 0.96);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      pointer-events: auto;
      animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .toast.success { border-left: 4px solid var(--gold); }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Loading Overlay */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(245, 158, 11, 0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Main Container */
    .app-container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* ==========================================================================
       2. HEADER & CURRENT USER RANK SUMMARY CARD
       ========================================================================== */
    .leader-header-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(18, 26, 43, 0.85) 100%);
      border: 1px solid rgba(245, 158, 11, 0.25);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      margin-bottom: var(--section-gap);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .trophy-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .user-rank-box-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(10, 15, 26, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: var(--radius-md);
      margin-top: 14px;
      text-align: center;
    }

    .rank-stat-lbl {
      font-size: 9px;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .rank-stat-val {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold);
      margin-top: 2px;
    }

    /* ==========================================================================
       3. TOP 3 PODIUM SECTION
       ========================================================================== */
    .podium-container {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      margin-bottom: var(--section-gap);
      padding: 10px 0;
    }

    .podium-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-md);
      padding: 12px 8px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: var(--transition);
    }

    /* Rank Heights */
    .podium-card.rank-1 {
      height: 185px;
      border-color: var(--gold);
      box-shadow: 0 0 20px var(--gold-glow);
      background: linear-gradient(to top, rgba(245, 158, 11, 0.15) 0%, rgba(18, 26, 43, 0.85) 100%);
      order: 2;
    }

    .podium-card.rank-2 {
      height: 165px;
      border-color: var(--silver);
      box-shadow: 0 0 15px var(--silver-glow);
      order: 1;
    }

    .podium-card.rank-3 {
      height: 150px;
      border-color: var(--bronze);
      box-shadow: 0 0 15px var(--bronze-glow);
      order: 3;
    }

    .crown-icon {
      position: absolute;
      top: -14px;
      font-size: 18px;
    }

    .podium-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      margin-top: 6px;
      margin-bottom: 6px;
      border: 2px solid white;
    }

    .rank-1 .podium-avatar { border-color: var(--gold); width: 50px; height: 50px; }
    .rank-2 .podium-avatar { border-color: var(--silver); }
    .rank-3 .podium-avatar { border-color: var(--bronze); }

    .podium-name {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .podium-uid {
      font-size: 9px;
      color: var(--text-muted);
    }

    .podium-earning {
      font-size: 11px;
      font-weight: 800;
      color: var(--gold);
      margin-top: auto;
    }

    /* ==========================================================================
       4. TOP LEADERBOARD LIST
       ========================================================================== */
    .card-block {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: var(--section-gap);
    }

    .section-head {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .leader-list-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leader-row-item {
      background: rgba(10, 15, 26, 0.5);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: var(--transition);
    }

    .leader-row-item.current-user-row {
      border-color: var(--primary);
      background: rgba(16, 185, 129, 0.1);
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .rank-num-badge {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-weight: 800;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .rank-num-badge.r-1 { background: var(--gold); color: #000; }
    .rank-num-badge.r-2 { background: var(--silver); color: #000; }
    .rank-num-badge.r-3 { background: var(--bronze); color: #fff; }

    .user-avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .user-details {
      min-width: 0;
    }

    .user-name-txt {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-uid-txt {
      font-size: 10px;
      color: var(--text-muted);
    }

    .row-right {
      text-align: right;
      flex-shrink: 0;
    }

    .earning-val-txt {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold);
    }

    .rank-badge-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .badge-elite { background: rgba(139, 92, 246, 0.2); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-pro { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-member { background: rgba(255, 255, 255, 0.06); color: var(--text-muted); }

    /* ==========================================================================
       5. FIXED BOTTOM NAVIGATION BAR
       ========================================================================== */
    .bottom-nav-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(8, 12, 20, 0.92);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      color: var(--text-muted);
      width: 20%;
      height: 100%;
    }

    .nav-tab svg {
      width: 22px;
      height: 22px;
      stroke: var(--text-muted);
      transition: var(--transition);
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-tab.active {
      color: var(--primary);
    }

    .nav-tab.active svg {
      stroke: var(--primary);
    }
  </style>
</head>

  <!-- JAVASCRIPT LEADERBOARD LOGIC & AUTO-REPLACE DEMO SYSTEM -->
  <script>
    // ==========================================================================
    // 1. FIREBASE CONFIGURATION & INITIALIZATION
    // ==========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBFKWIm1kUaP47rsHtEEP05G66-SSRsvwA",
      authDomain: "gamil-sever.firebaseapp.com",
      databaseURL: "https://gamil-sever-default-rtdb.firebaseio.com",
      projectId: "gamil-sever",
      storageBucket: "gamil-sever.firebasestorage.app",
      messagingSenderId: "895391304528",
      appId: "1:895391304528:web:4b86c59ce3163607beba55"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let currentUserAuthUid = null;
    let previousUserRank = null;

    // ==========================================================================
    // 2. STARTING DEMO ACCOUNTS (10 REALISTIC DEMO USERS)
    // ==========================================================================
    const demoAccounts = [
      { name: "Rahim Chowdhury", uid: "849201", totalEarnings: 12500, activeReferral: 34, isDemo: true },
      { name: "Karim Ahmed", uid: "739210", totalEarnings: 11200, activeReferral: 29, isDemo: true },
      { name: "Hasan Mahmud", uid: "610283", totalEarnings: 10300, activeReferral: 25, isDemo: true },
      { name: "Jony Sheikh", uid: "951024", totalEarnings: 9700, activeReferral: 22, isDemo: true },
      { name: "Sakib Al Hasan", uid: "302918", totalEarnings: 8900, activeReferral: 19, isDemo: true },
      { name: "Nayeem Islam", uid: "519203", totalEarnings: 8200, activeReferral: 17, isDemo: true },
      { name: "Rakib Hossain", uid: "402911", totalEarnings: 7600, activeReferral: 15, isDemo: true },
      { name: "Rifat Khan", uid: "812039", totalEarnings: 7100, activeReferral: 13, isDemo: true },
      { name: "Tamim Iqbal", uid: "291038", totalEarnings: 6600, activeReferral: 11, isDemo: true },
      { name: "Mehedi Hasan", uid: "672901", totalEarnings: 6200, activeReferral: 10, isDemo: true }
    ];

    // ==========================================================================
    // 3. SECURITY GUARD & REALTIME DATABASE LISTENERS
    // ==========================================================================
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }

      currentUserAuthUid = user.uid;

      // Realtime Listener for All Users
      database.ref('users').on('value', (snapshot) => {
        const allUsers = snapshot.val() || {};

        // Security check for current user
        if (!allUsers[user.uid] || allUsers[user.uid].accountStatus !== 'active') {
          alert("Your account is waiting for Main Admin approval.");
          auth.signOut().then(() => window.location.href = 'index.html');
          return;
        }

        processAndRenderLeaderboard(allUsers);
        hideLoader();
      }, (error) => {
        console.error("Database Listener Error:", error);
        hideLoader();
      });
    });

    // ==========================================================================
    // 4. AUTO REPLACE & RANKING ENGINE
    // ==========================================================================
    function processAndRenderLeaderboard(allUsers) {
      const realUsersList = [];

      // Extract Active Real Users
      Object.keys(allUsers).forEach(key => {
        const u = allUsers[key];
        if (u.accountStatus === 'active') {
          realUsersList.push({
            authUid: key,
            name: u.name || 'User',
            uid: u.uid || u.referralCode || '------',
            totalEarnings: u.totalEarnings || u.balance || 0,
            activeReferral: u.activeReferral || 0,
            photoUrl: u.photoUrl || u.profilePhoto || null,
            createdAt: u.createdAt || Date.now(),
            isDemo: false
          });
        }
      });

      // Combine Real Users and Demo Accounts
      const combinedList = [...realUsersList, ...demoAccounts];

      // Sorting Rule: Highest Total Earnings First, Earlier Registration Second
      combinedList.sort((a, b) => {
        if (b.totalEarnings !== a.totalEarnings) {
          return b.totalEarnings - a.totalEarnings;
        }
        return (a.createdAt || 0) - (b.createdAt || 0);
      });

      // Render Top 3 Podium
      renderPodium(combinedList.slice(0, 3));

      // Render Full Leaderboard List
      renderLeaderboardList(combinedList);

      // Calculate Current User Position Stats & Trigger Rank Notifications
      calculateCurrentUserRankStats(combinedList);
    }

    // ==========================================================================
    // 5. PODIUM & LIST RENDERING FUNCTIONS
    // ==========================================================================
    function renderPodium(top3) {
      if (top3[0]) fillPodiumCard(1, top3[0]);
      if (top3[1]) fillPodiumCard(2, top3[1]);
      if (top3[2]) fillPodiumCard(3, top3[2]);
    }

    function fillPodiumCard(rank, data) {
      const avatar = data.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(data.name)}&background=10b981&color=fff`;
      document.getElementById(`p${rank}-avatar`).src = avatar;
      document.getElementById(`p${rank}-name`).textContent = data.name;
      document.getElementById(`p${rank}-uid`).textContent = `UID: ${data.uid}`;
      document.getElementById(`p${rank}-earning`).textContent = `৳ ${data.totalEarnings.toLocaleString()}`;
    }

    function renderLeaderboardList(list) {
      const container = document.getElementById('leaderboard-list');
      container.innerHTML = '';

      list.forEach((item, index) => {
        const rank = index + 1;
        const row = document.createElement('div');
        row.className = `leader-row-item ${item.authUid === currentUserAuthUid ? 'current-user-row' : ''}`;

        const avatar = item.photoUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=10b981&color=fff`;

        let badgeHtml = '<span class="rank-badge-tag badge-member">Member</span>';
        if (rank <= 3) badgeHtml = '<span class="rank-badge-tag badge-pro">Top 3 Leader</span>';
        else if (rank <= 10) badgeHtml = '<span class="rank-badge-tag badge-elite">Top 10 Elite</span>';

        let numBadgeClass = 'rank-num-badge';
        if (rank === 1) numBadgeClass += ' r-1';
        else if (rank === 2) numBadgeClass += ' r-2';
        else if (rank === 3) numBadgeClass += ' r-3';

        row.innerHTML = `
          <div class="row-left">
            <div class="${numBadgeClass}">${rank}</div>
            <img class="user-avatar-sm" src="${avatar}" alt="Avatar">
            <div class="user-details">
              <div class="user-name-txt">${escapeHTML(item.name)} ${item.authUid === currentUserAuthUid ? '(You)' : ''}</div>
              <div class="user-uid-txt">UID: ${item.uid} | ${item.activeReferral} Referrals</div>
            </div>
          </div>
          <div class="row-right">
            <div class="earning-val-txt">৳ ${item.totalEarnings.toLocaleString()}</div>
            ${badgeHtml}
          </div>
        `;
        container.appendChild(row);
      });
    }

    // ==========================================================================
    // 6. CURRENT USER RANK NOTIFICATION SYSTEM
    // ==========================================================================
    function calculateCurrentUserRankStats(list) {
      const myIndex = list.findIndex(u => u.authUid === currentUserAuthUid);

      if (myIndex !== -1) {
        const myRank = myIndex + 1;
        const myData = list[myIndex];

        document.getElementById('my-rank-val').textContent = `#${myRank}`;
        document.getElementById('my-earnings-val').textContent = `৳ ${myData.totalEarnings.toLocaleString()}`;
        document.getElementById('my-above-val').textContent = myIndex;
        document.getElementById('my-below-val').textContent = list.length - myRank;

        // Rank Change Toast Notifications
        if (previousUserRank !== null && previousUserRank !== myRank) {
          if (myRank < previousUserRank) {
            showToast(`🏆 Congratulations! You climbed to Rank #${myRank}!`, "success");
          }
        }
        previousUserRank = myRank;
      }
    }

    // ==========================================================================
    // 7. HELPER FUNCTIONS
    // ==========================================================================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      toast.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg> <span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'slideDown 0.3s ease reverse forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function hideLoader() {
      const loader = document.getElementById('loading-overlay');
      loader.style.opacity = '0';
      loader.style.visibility = 'hidden';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
